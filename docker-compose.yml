version: "3.8"

services:
  fantasy-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantasy-football-bot
    restart: unless-stopped
    
    # Secrets/config live in config.env (kept out of the image itself)
    env_file:
      - config.env
    environment:
      - DASHBOARD_URL=https://fantasy.ethandbard.com

    ports:
      - "8000:8000"

    volumes:
      # Optional: Mount logs directory for debugging
      - ./logs:/app/logs
      # Persists the SQLite snapshot DB backing the dashboard
      - ./data:/app/data

    # Auto-restart policy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      # #Used for private leagues. See Private Leagues Section for documentation
      # ESPN_S2:
      # #Used for private leagues. See Private Leagues Section for documentation
      # SWID:

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fantasy-bot-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ~/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - fantasy-bot
