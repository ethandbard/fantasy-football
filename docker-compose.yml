services:
  fantasy-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantasy-football-bot
    restart: unless-stopped

    env_file:
      - config.env

    # Published for local and off-VPS hosts. compose.vps.yml clears this so
    # the shared tunnel is the only way in on the VPS.
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"

    volumes:
      - ./data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The team agents. One model run at a time; the bot reaches it at
  # http://fantasy-agent:8010. Shares config.env and data/ with the bot.
  fantasy-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: fantasy-football-agent
    restart: unless-stopped
    env_file:
      - config.env
    volumes:
      - ./data:/app/data
    mem_limit: 1200m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Off-VPS public URL only. Never start this profile with the VPS tunnel
  # credentials: two connectors on one named tunnel split traffic.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fantasy-football-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./tunnel:/etc/cloudflared:ro
    depends_on:
      - fantasy-bot
