services:
  fantasy-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantasy-football-bot
    restart: unless-stopped

    # Secrets/config live in config.env (kept out of the image itself)
    env_file:
      - config.env
    environment:
      - DASHBOARD_URL=https://fantasy.ethandbard.com

    ports:
      - "8000:8000"

    volumes:
      # Persists the SQLite snapshot DB backing the dashboard
      - ./data:/app/data

    # Nothing writes to /app/logs; bound Docker's own stderr capture instead of an empty bind mount
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fantasy-football-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ~/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - fantasy-bot
