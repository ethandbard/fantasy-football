# Renders docs/ and publishes the static site to the gh-pages branch.
# GitHub Pages serves https://ethandbard.github.io/fantasy-football/ from that
# branch. A Cloudflare Worker at fantasy-docs.ethandbard.com fetches the same
# GitHub Pages copy, so both URLs update from this workflow. Redeploy the
# Worker from docs/ only when proxy-worker.js changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/quarto-publish.yml"

name: Publish docs

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs

      - name: Disable Jekyll processing
        run: touch docs/_site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          force_orphan: true
